<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LT-2.0 Failsafe</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --bg-surface: #141417;
    --bg-card: #1a1a1f;
    --bg-input: #111114;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --text-primary: #f0efe8;
    --text-secondary: #7a7975;
    --text-muted: #3e3d3a;
    --builder: #1d9e75;
    --builder-dim: rgba(29,158,117,0.12);
    --builder-glow: rgba(29,158,117,0.2);
    --learner: #7f77dd;
    --learner-dim: rgba(127,119,221,0.12);
    --learner-glow: rgba(127,119,221,0.2);
    --casual: #ef9f27;
    --casual-dim: rgba(239,159,39,0.12);
    --casual-glow: rgba(239,159,39,0.2);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 40px 20px 80px;
    display: flex;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 8px;
  }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }
  .header-tag {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
  }
  .live-clock {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* Card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--border-hover); }

  .card-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 18px;
    font-weight: 500;
  }

  /* Form */
  .form-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }

  .input-label {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
  }

  input, select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 11px 14px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }
  input:focus, select:focus {
    border-color: var(--border-hover);
    background: #16161a;
  }
  input::placeholder { color: var(--text-muted); }

  button {
    font-family: 'DM Mono', monospace;
  }

  .stamp-btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 11px;
    padding: 0 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .stamp-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }

  /* Category pills */
  .pill-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .pill {
    flex: 1;
    padding: 9px 0;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }
  .pill.builder.active { background: var(--builder-dim); border-color: var(--builder); color: var(--builder); }
  .pill.learner.active { background: var(--learner-dim); border-color: var(--learner); color: var(--learner); }
  .pill.casual.active  { background: var(--casual-dim);  border-color: var(--casual);  color: var(--casual); }
  .pill:hover:not(.active) { border-color: var(--border-hover); color: var(--text-primary); }

  .time-row { display: flex; gap: 10px; align-items: flex-end; }
  .time-row .form-row { flex: 1; margin-bottom: 0; }

  .time-sep {
    color: var(--text-muted);
    font-size: 18px;
    padding-bottom: 10px;
    flex-shrink: 0;
  }

  /* Save button */
  .btn-save {
    width: 100%;
    padding: 13px;
    margin-top: 14px;
    background: var(--text-primary);
    color: var(--bg);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-save:hover { opacity: 0.88; }
  .btn-save:active { transform: scale(0.98); }

  /* Day navigator */
  .day-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .day-nav-btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .day-nav-btn:hover:not(:disabled) { border-color: var(--border-hover); color: var(--text-primary); }
  .day-nav-btn:disabled { opacity: 0.3; cursor: default; }

  .day-label-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  .day-label {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    padding: 6px 0;
  }
  .day-sub { font-size: 10px; color: var(--text-muted); margin-left: 8px; }
  #dayPicker {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    padding: 0;
  }
  .today-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .today-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }

  /* Distribution bar */
  .dist-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .dist-cell {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .dist-cell.builder.active { background: var(--builder-dim); border-color: var(--builder); }
  .dist-cell.learner.active { background: var(--learner-dim); border-color: var(--learner); }
  .dist-cell.casual.active  { background: var(--casual-dim);  border-color: var(--casual); }
  .dist-cell:hover:not(.active) { border-color: var(--border-hover); }

  .dist-name {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .dist-cell.builder.active .dist-name { color: var(--builder); }
  .dist-cell.learner.active .dist-name { color: var(--learner); }
  .dist-cell.casual.active  .dist-name { color: var(--casual); }

  .dist-pct {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: 2px;
  }
  .dist-mins { font-size: 11px; color: var(--text-secondary); }

  /* Summary row */
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .summary-label { font-size: 11px; color: var(--text-secondary); letter-spacing: 0.08em; text-transform: uppercase; }
  .summary-total {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
  }

  /* Log items */
  .log-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    animation: slideIn 0.25s ease;
  }
  .log-item:last-child { border-bottom: none; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .log-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .builder .log-dot { background: var(--builder); box-shadow: 0 0 6px var(--builder-glow); }
  .learner .log-dot { background: var(--learner); box-shadow: 0 0 6px var(--learner-glow); }
  .casual  .log-dot { background: var(--casual);  box-shadow: 0 0 6px var(--casual-glow); }

  .log-body { flex: 1; min-width: 0; }
  .log-task {
    font-size: 13px;
    color: var(--text-primary);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .log-meta { font-size: 11px; color: var(--text-secondary); }
  .log-dur {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-secondary);
    flex-shrink: 0;
    align-self: center;
  }

  .log-cat-tag {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 6px;
  }
  .builder .log-cat-tag { background: var(--builder-dim); color: var(--builder); }
  .learner .log-cat-tag { background: var(--learner-dim); color: var(--learner); }
  .casual  .log-cat-tag { background: var(--casual-dim);  color: var(--casual); }

  .empty-state {
    text-align: center;
    padding: 40px 0;
    color: var(--text-muted);
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  /* Filter clear */
  .filter-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .filter-label { font-size: 11px; color: var(--text-secondary); letter-spacing: 0.08em; text-transform: uppercase; }
  .filter-clear {
    font-size: 11px;
    color: var(--text-secondary);
    cursor: pointer;
    border: none;
    background: none;
    font-family: 'DM Mono', monospace;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 0;
  }
  .filter-clear:hover { color: var(--text-primary); }

  .btn-clear-logs {
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    border: none;
    background: none;
    font-family: 'DM Mono', monospace;
    padding: 0;
    letter-spacing: 0.04em;
    transition: color 0.15s;
  }
  .btn-clear-logs:hover { color: #e24b4a; }

  .confirm-banner {
    background: rgba(226,75,74,0.08);
    border: 1px solid rgba(226,75,74,0.25);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    animation: slideIn 0.2s ease;
  }
  .confirm-msg { font-size: 12px; color: #e24b4a; }
  .confirm-actions { display: flex; gap: 10px; }
  .confirm-yes {
    font-size: 11px; font-family: 'DM Mono', monospace;
    background: #e24b4a; color: #fff;
    border: none; border-radius: 4px;
    padding: 5px 10px; cursor: pointer;
  }
  .confirm-no {
    font-size: 11px; font-family: 'DM Mono', monospace;
    background: none; color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 10px; cursor: pointer;
  }
  .confirm-no:hover { color: var(--text-primary); border-color: var(--border-hover); }

  /* 30-day history strip */
  .history-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .history-scroll::-webkit-scrollbar { height: 4px; }
  .hist-day {
    flex-shrink: 0;
    width: 40px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 4px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .hist-day:hover { border-color: var(--border-hover); }
  .hist-day.selected { border-color: var(--text-primary); }
  .hist-day.empty { opacity: 0.35; }
  .hist-dow { font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
  .hist-date { font-size: 12px; font-family: 'Syne', sans-serif; font-weight: 700; margin-bottom: 4px; }
  .hist-bar { height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .hist-bar-fill { height: 100%; background: var(--text-secondary); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Input time fix */
  input[type="time"]::-webkit-calendar-picker-indicator,
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.4);
    cursor: pointer;
  }
  select option { background: #1a1a1f; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>LT-2.0</h1>
    <span class="header-tag">Failsafe</span>
    <span class="live-clock" id="clock">00:00:00</span>
  </div>

  <!-- Add Log Card -->
  <div class="card">
    <div class="card-label">New Entry</div>

    <div class="pill-row">
      <button class="pill builder active" data-val="builder" onclick="selectCategory(this)">Builder</button>
      <button class="pill learner"        data-val="learner" onclick="selectCategory(this)">Learner</button>
      <button class="pill casual"         data-val="casual"  onclick="selectCategory(this)">Casual</button>
    </div>

    <div class="form-row">
      <span class="input-label">What did you do?</span>
      <input id="taskName" placeholder="Task description..." autocomplete="off">
    </div>
    <div class="time-row">
      <div class="form-row">
        <span class="input-label">Start</span>
        <div style="display:flex; gap:6px;">
          <input type="time" id="startTime">
          <button class="stamp-btn" onclick="stampNow('start')">now</button>
        </div>
      </div>
      <div class="time-sep">→</div>
      <div class="form-row">
        <span class="input-label">End</span>
        <div style="display:flex; gap:6px;">
          <input type="time" id="endTime">
          <button class="stamp-btn" onclick="stampNow('end')">now</button>
        </div>
      </div>
    </div>

    <button class="btn-save" onclick="saveLog()">Save Entry</button>
  </div>

  <!-- History strip -->
  <div class="card">
    <div class="card-label">Last 30 Days</div>
    <div class="history-scroll" id="historyScroll"></div>
  </div>

  <!-- Logs Card -->
  <div class="card">
    <div class="card-label">Daily Log</div>

    <div class="day-nav">
      <button class="day-nav-btn" onclick="shiftDay(-1)">‹</button>
      <div class="day-label-wrap">
        <div>
          <span class="day-label" id="dayLabel">Today</span>
          <span class="day-sub" id="daySub"></span>
        </div>
        <input type="date" id="dayPicker" onchange="pickDay(this.value)">
      </div>
      <button class="day-nav-btn" id="nextDayBtn" onclick="shiftDay(1)">›</button>
      <button class="today-btn" id="todayBtn" onclick="goToday()" style="display:none;">today</button>
    </div>

    <div class="dist-grid" id="distGrid"></div>

    <div class="summary-row">
      <span class="summary-label">Total logged</span>
      <span class="summary-total" id="totalDisplay">0m</span>
      <button class="btn-clear-logs" onclick="askClear()">clear this day</button>
    </div>

    <div class="confirm-banner" id="confirmBanner" style="display:none;">
      <span class="confirm-msg" id="confirmMsg">Clear this day's logs? This cannot be undone.</span>
      <div class="confirm-actions">
        <button class="confirm-no"  onclick="cancelClear()">cancel</button>
        <button class="confirm-yes" onclick="confirmClear()">yes, clear</button>
      </div>
    </div>

    <div class="filter-row" id="filterRow" style="display:none;">
      <span class="filter-label" id="filterLabel"></span>
      <button class="filter-clear" onclick="clearFilter()">clear filter ×</button>
    </div>

    <div id="logsContainer"></div>
  </div>

</div>

<script>
  const STORAGE_KEY = 'lt2_logs';
  const HISTORY_DAYS = 30;

  // Migrate old flat-log format (no date field) by stamping them with today's date once.
  let logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let migrated = false;
  logs.forEach(l => { if (!l.date) { l.date = todayStr(); migrated = true; } });
  if (migrated) persist();

  let activeFilter = null;
  let selectedCategory = 'builder';
  let selectedDate = todayStr();

  const taskEl  = document.getElementById('taskName');
  const startEl = document.getElementById('startTime');
  const endEl   = document.getElementById('endTime');
  const dayPicker = document.getElementById('dayPicker');

  function pad(n){ return String(n).padStart(2,'0'); }

  function todayStr(){
    const n = new Date();
    return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;
  }

  function dateFromStr(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  function shiftDateStr(s, deltaDays){
    const d = dateFromStr(s);
    d.setDate(d.getDate() + deltaDays);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function persist(){
    // keep only last HISTORY_DAYS worth of entries
    const cutoff = shiftDateStr(todayStr(), -(HISTORY_DAYS - 1));
    logs = logs.filter(l => l.date >= cutoff);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
  }

  function setDefaultTimes(){
    const now = new Date();
    const end = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const s = new Date(now - 30*60000);
    const start = `${pad(s.getHours())}:${pad(s.getMinutes())}`;
    startEl.value = start;
    endEl.value = end;
  }

  function clockTick(){
    const n = new Date();
    document.getElementById('clock').textContent =
      `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  }
  setInterval(clockTick, 1000);
  clockTick();

  function selectCategory(el){
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    selectedCategory = el.dataset.val;
  }

  function stampNow(which){
    const n = new Date();
    const t = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
    if (which === 'start') startEl.value = t;
    else endEl.value = t;
  }

  function saveLog(){
    const taskName  = taskEl.value.trim() || 'Untitled task';
    const startTime = startEl.value;
    const endTime   = endEl.value;
    if(!startTime || !endTime) return;

    let diff = (new Date('1970-01-01 '+endTime) - new Date('1970-01-01 '+startTime)) / 60000;
    if(diff < 0) diff += 1440;
    diff = Math.round(diff);

    // entries are always logged against today's real date
    logs.unshift({ date: todayStr(), category: selectedCategory, taskName, startTime, endTime, duration: diff });
    persist();

    // next start = end + 1 min
    let next = new Date('1970-01-01 '+endTime);
    next.setMinutes(next.getMinutes() + 1);
    startEl.value = `${pad(next.getHours())}:${pad(next.getMinutes())}`;
    endEl.value   = startEl.value;
    taskEl.value  = '';
    taskEl.focus();

    // jump view to today so the new entry is visible
    selectedDate = todayStr();
    render();
  }

  taskEl.addEventListener('keydown', e => { if(e.key === 'Enter') saveLog(); });

  function clearFilter(){
    activeFilter = null;
    render();
  }

  function shiftDay(delta){
    const next = shiftDateStr(selectedDate, delta);
    if (next > todayStr()) return;
    selectedDate = next;
    activeFilter = null;
    render();
  }

  function pickDay(val){
    if (!val) return;
    if (val > todayStr()) val = todayStr();
    selectedDate = val;
    activeFilter = null;
    render();
  }

  function goToday(){
    selectedDate = todayStr();
    activeFilter = null;
    render();
  }

  function askClear(){
    const dayLogs = logs.filter(l => l.date === selectedDate);
    if(dayLogs.length === 0) return;
    document.getElementById('confirmMsg').textContent =
      `Clear logs for ${formatDayLabel(selectedDate)}? This cannot be undone.`;
    document.getElementById('confirmBanner').style.display = 'flex';
  }
  function cancelClear(){
    document.getElementById('confirmBanner').style.display = 'none';
  }
  function confirmClear(){
    logs = logs.filter(l => l.date !== selectedDate);
    persist();
    document.getElementById('confirmBanner').style.display = 'none';
    activeFilter = null;
    render();
  }

  function formatDur(m){
    if(m < 60) return `${m}m`;
    return `${Math.floor(m/60)}h ${m%60}m`;
  }

  function formatDayLabel(dateStr){
    const today = todayStr();
    const yesterday = shiftDateStr(today, -1);
    if (dateStr === today) return 'Today';
    if (dateStr === yesterday) return 'Yesterday';
    const d = dateFromStr(dateStr);
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function renderHistoryStrip(){
    const strip = document.getElementById('historyScroll');
    strip.innerHTML = '';
    const today = todayStr();

    // totals per day for scaling bars
    const totals = {};
    logs.forEach(l => { totals[l.date] = (totals[l.date] || 0) + l.duration; });
    const maxTotal = Math.max(1, ...Object.values(totals));

    const days = [];
    for (let i = HISTORY_DAYS - 1; i >= 0; i--) days.push(shiftDateStr(today, -i));

    days.forEach(dateStr => {
      const d = dateFromStr(dateStr);
      const mins = totals[dateStr] || 0;
      const cell = document.createElement('div');
      cell.className = `hist-day${mins===0?' empty':''}${dateStr===selectedDate?' selected':''}`;
      cell.innerHTML = `
        <div class="hist-dow">${d.toLocaleDateString(undefined,{weekday:'narrow'})}</div>
        <div class="hist-date">${d.getDate()}</div>
        <div class="hist-bar"><div class="hist-bar-fill" style="width:${Math.round(mins/maxTotal*100)}%"></div></div>
      `;
      cell.title = `${formatDayLabel(dateStr)} — ${formatDur(mins)}`;
      cell.onclick = () => { selectedDate = dateStr; activeFilter = null; render(); };
      strip.appendChild(cell);
    });

    // auto-scroll to the right (today) on first render
    strip.scrollLeft = strip.scrollWidth;
  }

  function render(){
    const container = document.getElementById('logsContainer');
    const distGrid  = document.getElementById('distGrid');
    const filterRow = document.getElementById('filterRow');
    const filterLabel = document.getElementById('filterLabel');

    // day nav state
    document.getElementById('dayLabel').textContent = formatDayLabel(selectedDate);
    document.getElementById('daySub').textContent = selectedDate;
    dayPicker.value = selectedDate;
    document.getElementById('nextDayBtn').disabled = selectedDate >= todayStr();
    document.getElementById('todayBtn').style.display = selectedDate === todayStr() ? 'none' : 'inline-block';

    const dayLogs = logs.filter(l => l.date === selectedDate);

    let total = 0;
    let cat = { builder:0, learner:0, casual:0 };
    dayLogs.forEach(l => { total += l.duration; cat[l.category] += l.duration; });

    // Distribution cells
    distGrid.innerHTML = '';
    ['builder','learner','casual'].forEach(c => {
      const mins = cat[c];
      const pct  = total ? Math.round(mins/total*100) : 0;
      const cell = document.createElement('div');
      cell.className = `dist-cell ${c}${activeFilter===c?' active':''}`;
      cell.innerHTML = `
        <div class="dist-name">${c}</div>
        <div class="dist-pct">${pct}%</div>
        <div class="dist-mins">${formatDur(mins)}</div>
      `;
      cell.style.backgroundImage = `linear-gradient(to right, var(--${c}-dim) ${pct}%, transparent ${pct}%)`;
      cell.style.backgroundSize = '100% 3px';
      cell.style.backgroundRepeat = 'no-repeat';
      cell.style.backgroundPosition = 'bottom';
      cell.onclick = () => {
        activeFilter = activeFilter === c ? null : c;
        render();
      };
      distGrid.appendChild(cell);
    });

    // Total
    document.getElementById('totalDisplay').textContent = formatDur(total);

    // Filter row
    if(activeFilter){
      filterRow.style.display = 'flex';
      filterLabel.textContent = `Showing: ${activeFilter}`;
    } else {
      filterRow.style.display = 'none';
    }

    // Logs
    container.innerHTML = '';
    const filtered = activeFilter ? dayLogs.filter(l => l.category === activeFilter) : dayLogs;

    if(filtered.length === 0){
      container.innerHTML = `<div class="empty-state">no entries for this day</div>`;
    } else {
      filtered.forEach(l => {
        const el = document.createElement('div');
        el.className = `log-item ${l.category}`;
        el.innerHTML = `
          <div class="log-dot"></div>
          <div class="log-body">
            <div class="log-task">${l.taskName}<span class="log-cat-tag">${l.category}</span></div>
            <div class="log-meta">${l.startTime} → ${l.endTime}</div>
          </div>
          <div class="log-dur">${formatDur(l.duration)}</div>
        `;
        container.appendChild(el);
      });
    }

    renderHistoryStrip();
  }

  setDefaultTimes();
  render();
</script>
</body>
</html>
